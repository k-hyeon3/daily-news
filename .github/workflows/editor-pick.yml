name: 에디터 픽 생성

# PC가 꺼져 있어도 도는 클라우드 버전. Claude Code(API 키)로 오늘 호를 만들어 data/editions.json에 커밋한다.
# 필요한 설정: 저장소 Secrets에 ANTHROPIC_API_KEY (gh secret set ANTHROPIC_API_KEY)
on:
  schedule:
    - cron: "10 22,1,4,7,10,13 * * *"   # 한국 시간 07:10, 10:10, 13:10, 16:10, 19:10, 22:10
  workflow_dispatch:

permissions:
  contents: write   # editions.json 커밋·push
  actions: write    # push 뒤 배포 워크플로 실행(GITHUB_TOKEN으로 한 push는 다른 워크플로를 자동으로 깨우지 못한다)

concurrency:
  group: editor-pick
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: git 사용자 설정
        run: |
          git config user.name "daily-news-bot"
          git config user.email "daily-news-bot@users.noreply.github.com"

      - name: 에디터 픽 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::Secrets에 ANTHROPIC_API_KEY가 없습니다"; exit 1; fi
          git rev-parse HEAD > "$RUNNER_TEMP/before.sha"
          TODAY=$(TZ=Asia/Seoul date +%F)
          echo "Read tools/pick_prompt.md in this repository and follow it exactly. TODAY is $TODAY (Asia/Seoul)." | \
            claude -p --model claude-sonnet-5-5 --permission-mode acceptEdits \
              --allowedTools "WebSearch,Read,Write,Bash(python tools/fetch_news.py),Bash(python tools/pick_candidates.py),Bash(python tools/add_edition.py --file .pick_tmp.json),Bash(rm .pick_tmp.json)"

      - name: 배포 실행
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # add_edition.py가 새 커밋을 push했을 때만 사이트를 다시 배포한다
          if [ "$(git rev-parse HEAD)" != "$(cat "$RUNNER_TEMP/before.sha")" ]; then gh workflow run update-news.yml; else echo "새 호 없음: 배포 생략"; fi
